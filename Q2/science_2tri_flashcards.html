<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Science — Flashcards | Hydrosphere & Hydropower</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900&family=DM+Sans:wght@400;500;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{--paper:#fef9ec;--ink:#1a1a2e;--red:#e63946;--yellow:#ffbe0b;--blue:#3a86ff;--green:#06a77d;--purple:#7209b7;--teal:#0096a0;--sky:#38b6ff;--shadow:6px 6px 0 var(--ink)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;padding:20px 16px 40px;background-image:radial-gradient(circle at 20% 10%,rgba(56,182,255,.15) 0%,transparent 40%),radial-gradient(circle at 90% 80%,rgba(0,150,160,.12) 0%,transparent 40%)}
.container{max-width:700px;margin:0 auto}
header{text-align:center;margin-bottom:22px}
h1{font-family:'Fraunces',serif;font-size:clamp(1.5rem,5vw,2.1rem);font-weight:900;line-height:1}
h1 .accent{color:var(--sky);font-style:italic}
.subtitle{font-family:'Caveat',cursive;font-size:1.25rem;color:var(--blue);margin-top:4px}
.top-bar{display:flex;justify-content:space-between;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px 14px;box-shadow:3px 3px 0 var(--ink);margin-bottom:14px;font-size:.9rem;font-weight:700;flex-wrap:wrap;gap:8px}
.progress{display:flex;align-items:center;gap:8px}
.progress-bar{width:100px;height:10px;background:#eee;border:2px solid var(--ink);border-radius:20px;overflow:hidden}
.progress-fill{height:100%;background:var(--green);width:0%;transition:width .4s}
.cat-badge{padding:3px 10px;border:2px solid var(--ink);border-radius:20px;font-size:.75rem;background:var(--yellow);text-transform:uppercase;letter-spacing:.5px}
.filters{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.filter-btn{font-family:'DM Sans',sans-serif;font-size:.78rem;font-weight:700;padding:5px 11px;border:2px solid var(--ink);border-radius:20px;background:#fff;cursor:pointer;transition:all .15s}
.filter-btn.active{background:var(--ink);color:var(--paper)}
.flashcard{width:100%;min-height:320px;border:3px solid var(--ink);border-radius:20px;box-shadow:var(--shadow);padding:44px 22px 40px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:linear-gradient(135deg,#fff 0%,#e6f6ff 100%);cursor:pointer;position:relative;margin-bottom:18px;transition:background .25s ease,opacity .15s ease;user-select:none;-webkit-user-select:none}
.flashcard.is-back{background:linear-gradient(135deg,#fff 0%,#e6fff4 100%)}
.flashcard.fading{opacity:0}
.card-label{position:absolute;top:13px;left:16px;font-family:'Caveat',cursive;font-size:.95rem;color:var(--purple);font-weight:700}
.card-counter{position:absolute;top:13px;right:16px;font-size:.78rem;color:#888;font-weight:700}
.card-hint{position:absolute;bottom:13px;left:50%;transform:translateX(-50%);font-family:'Caveat',cursive;font-size:.95rem;color:#999;white-space:nowrap}
.card-content{width:100%}
.card-prompt{font-family:'Fraunces',serif;font-size:clamp(1.1rem,3.8vw,1.6rem);font-weight:900;line-height:1.3;margin-bottom:10px}
.card-sub{font-size:.92rem;color:#666;font-style:italic;line-height:1.4}
.card-answer{font-family:'Fraunces',serif;font-size:clamp(1.1rem,3.8vw,1.6rem);font-weight:900;color:var(--blue);margin-bottom:10px;line-height:1.3}
.card-example{background:rgba(255,190,11,.25);border-left:3px solid var(--yellow);padding:9px 12px;border-radius:6px;font-size:.88rem;font-style:italic;max-width:95%;margin:0 auto;line-height:1.5}
.card-example strong{color:var(--red);font-style:normal}
.controls{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:10px;margin-bottom:12px}
.btn{font-family:'DM Sans',sans-serif;font-size:1rem;font-weight:700;padding:12px 14px;border:3px solid var(--ink);border-radius:12px;background:#fff;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:all .1s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn-nav{font-size:1.2rem;padding:12px 12px}
.btn-got{background:var(--green);color:#fff}
.btn-rev{background:var(--red);color:#fff}
.tools{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.tool-btn{font-family:'DM Sans',sans-serif;font-size:.83rem;font-weight:700;padding:7px 13px;border:2px solid var(--ink);border-radius:20px;background:#fff;cursor:pointer}
.tool-btn:hover{background:var(--yellow)}
.stats{margin-top:18px;padding:13px;background:#fff;border:3px solid var(--ink);border-radius:14px;display:flex;justify-content:space-around;text-align:center;font-size:.83rem}
.stat-value{font-family:'Fraunces',serif;font-size:1.7rem;font-weight:900;display:block}
.stat-value.green{color:var(--green)}.stat-value.red{color:var(--red)}.stat-value.blue{color:var(--blue)}
.finished{text-align:center;padding:36px 20px;background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:var(--shadow);display:none}
.finished.show{display:block}
.finished h2{font-family:'Fraunces',serif;font-size:1.9rem;color:var(--green);margin-bottom:10px}
.finished .big{font-size:3.5rem;display:block;margin-bottom:8px}
@media(max-width:480px){.controls{grid-template-columns:1fr 1fr}.btn-nav{grid-column:span 1}.flashcard{min-height:300px;padding:40px 16px 38px}}
</style>
</head>
<body>
<div class="container">
<header>
  <h1><span class="accent">Science</span> Flashcards</h1>
  <p class="subtitle">Tap the card to see the answer! 🎴</p>
</header>
<div class="top-bar">
  <div class="progress"><span id="progressText">1 / 40</span><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div></div>
  <div class="cat-badge" id="catBadge">Hydrosphere</div>
</div>
<div class="filters">
  <button class="filter-btn active" data-filter="all">All (40)</button>
  <button class="filter-btn" data-filter="hydrosphere">💧 Hydrosphere</button>
  <button class="filter-btn" data-filter="cycle">🔄 Water Cycle</button>
  <button class="filter-btn" data-filter="water">🌍 Water & Land</button>
  <button class="filter-btn" data-filter="hydropower">⚡ Hydropower</button>
  <button class="filter-btn" data-filter="review">⚠️ Review</button>
</div>
<div class="flashcard" id="flashcard" role="button" tabindex="0">
  <div class="card-label" id="cardLabel">Hydrosphere</div>
  <div class="card-counter" id="cardCounter">1/40</div>
  <div class="card-content" id="cardContent"></div>
  <div class="card-hint" id="cardHint">👆 tap to see answer</div>
</div>
<div class="controls">
  <button class="btn btn-nav" id="prevBtn">◀</button>
  <button class="btn btn-rev" id="reviewBtn">Review again</button>
  <button class="btn btn-got" id="gotItBtn">I got it! ✓</button>
  <button class="btn btn-nav" id="nextBtn">▶</button>
</div>
<div class="tools">
  <button class="tool-btn" id="shuffleBtn">🔀 Shuffle</button>
  <button class="tool-btn" id="resetBtn">↺ Reset</button>
</div>
<div class="stats">
  <div><span class="stat-value green" id="statGood">0</span><span>Got it</span></div>
  <div><span class="stat-value red" id="statReview">0</span><span>Review</span></div>
  <div><span class="stat-value blue" id="statLeft">40</span><span>Left</span></div>
</div>
<div class="finished" id="finishedScreen">
  <span class="big">🎉</span>
  <h2>Amazing work!</h2>
  <p style="margin-bottom:14px">You reviewed all the cards.</p>
  <p id="finishedStats" style="margin-bottom:20px"></p>
  <button class="btn" id="restartBtn" style="background:var(--blue);color:#fff">Start again 🔁</button>
</div>
</div>
<script>
var allCards=[
  // HYDROSPHERE (10)
  {cat:'hydrosphere',label:'Hydrosphere',q:'What is the hydrosphere?',sub:'',a:'All the water found on, under and above Earth\'s surface — in every form',ex:'Oceans, rivers, lakes, glaciers, groundwater AND water vapour in the air are all part of the hydrosphere.'},
  {cat:'hydrosphere',label:'Hydrosphere',q:'What does the word "hydro" mean?',sub:'',a:'Water',ex:'"Hydro" comes from Greek. Hydrosphere = the water layer of Earth.'},
  {cat:'hydrosphere',label:'Hydrosphere',q:'What percentage of Earth\'s surface is covered by water?',sub:'',a:'About 75% (three quarters)',ex:'That\'s why Earth is called the <strong>Blue Planet</strong> — most of it is water!'},
  {cat:'hydrosphere',label:'Hydrosphere',q:'What percentage of Earth\'s water is saltwater?',sub:'',a:'About 97.5% — found mostly in oceans and seas',ex:'Only 2.5% is fresh water, and most of THAT is frozen in glaciers.'},
  {cat:'hydrosphere',label:'Hydrosphere',q:'What percentage of Earth\'s water is fresh and easily available?',sub:'',a:'Less than 1% of all water on Earth',ex:'Most fresh water is frozen in glaciers or deep underground. Very little is in rivers and lakes.'},
  {cat:'hydrosphere',label:'Hydrosphere',q:'In what THREE forms can water exist in the hydrosphere?',sub:'',a:'Liquid, solid (ice/snow), and gas (water vapour)',ex:'Liquid = oceans/rivers. Solid = glaciers/ice caps. Gas = water vapour in the atmosphere.'},
  {cat:'hydrosphere',label:'Hydrosphere',q:'Where is water found in its SOLID form?',sub:'',a:'In glaciers, ice caps, polar ice and snow — mostly in cold regions',ex:'About 68.9% of all fresh water on Earth is frozen in glaciers and ice sheets!'},
  {cat:'hydrosphere',label:'Hydrosphere',q:'Where is water found in its GAS form?',sub:'',a:'In the atmosphere as water vapour',ex:'When the Sun heats the surface water, it evaporates and becomes water vapour in the air.'},
  {cat:'hydrosphere',label:'Hydrosphere',q:'Why is Earth also called the "Blue Planet"?',sub:'',a:'Because water covers about 75% of its surface, making it look blue from space',ex:'Even though it\'s named "Earth", if you look at it from space, you see more water than land.'},
  {cat:'hydrosphere',label:'Hydrosphere',q:'Does the hydrosphere include water underground?',sub:'',a:'Yes — groundwater deep inside the Earth is part of the hydrosphere',ex:'About 30.8% of Earth\'s fresh water is stored as groundwater beneath the surface.'},

  // WATER CYCLE (10)
  {cat:'cycle',label:'Water Cycle',q:'What is evaporation?',sub:'',a:'The Sun heats liquid water, which turns into water vapour and rises into the atmosphere',ex:'Evaporation happens mainly from oceans, lakes and rivers. The Sun is the engine that powers it.'},
  {cat:'cycle',label:'Water Cycle',q:'What is condensation?',sub:'',a:'Water vapour cools and turns back into liquid water droplets, forming clouds',ex:'Condensation is the opposite of evaporation. Warm air rises, cools, and water vapour becomes tiny droplets.'},
  {cat:'cycle',label:'Water Cycle',q:'What is precipitation?',sub:'',a:'Water falls from clouds back to Earth\'s surface as rain, snow, hail or sleet',ex:'When a cloud collects too many water droplets and gets too heavy, it releases them as precipitation.'},
  {cat:'cycle',label:'Water Cycle',q:'What is transpiration?',sub:'',a:'Plants release water vapour through their leaves into the atmosphere',ex:'Trees and plants are like little "pumps" — they pull water up from the ground and release it into the air.'},
  {cat:'cycle',label:'Water Cycle',q:'What is runoff?',sub:'',a:'Precipitation that flows over the land surface into rivers, lakes and oceans',ex:'When it rains on a hillside, the water flows down — that movement is called runoff.'},
  {cat:'cycle',label:'Water Cycle',q:'What is infiltration?',sub:'',a:'Water soaks down through the soil into the ground, becoming groundwater',ex:'Rain that doesn\'t run off or evaporate seeps into the ground through infiltration.'},
  {cat:'cycle',label:'Water Cycle',q:'What is sublimation in the water cycle?',sub:'',a:'Ice or snow turns directly into water vapour without becoming liquid first',ex:'This happens in very cold or dry places. Snow can "disappear" without melting — it sublimes!'},
  {cat:'cycle',label:'Water Cycle',q:'What is the CORRECT order of the basic water cycle?',sub:'',a:'Evaporation → Condensation (clouds) → Precipitation → Runoff/Infiltration → back to ocean',ex:'The Sun powers the whole cycle. Water is always moving and changing form.'},
  {cat:'cycle',label:'Water Cycle',q:'Does the water cycle purify water? How?',sub:'',a:'Yes — evaporation leaves salt and impurities behind, so water vapour is cleaner',ex:'That\'s why rain water is fresh even though most of it evaporated from salty oceans!'},
  {cat:'cycle',label:'Water Cycle',q:'What is the main energy source that powers the water cycle?',sub:'',a:'The Sun',ex:'Without the Sun\'s heat, there would be no evaporation and the water cycle would stop.'},

  // WATER & LAND (10)
  {cat:'water',label:'Water & Land',q:'How does the flow of water impact the land?',sub:'',a:'Water shapes valleys and landscapes through erosion, carrying sediments and depositing nutrients',ex:'Rivers carve valleys over thousands of years. Floods deposit nutrient-rich soil on plains.'},
  {cat:'water',label:'Water & Land',q:'How does water impact vegetation?',sub:'',a:'Plants depend on water from rain, rivers and groundwater to survive and grow',ex:'Without enough water, plants die. Drought kills vegetation and turns soil to dust.'},
  {cat:'water',label:'Water & Land',q:'How do floods affect the land?',sub:'',a:'They can deposit nutrient-rich sediments that make soil very fertile for farming',ex:'The Nile River floods every year — ancient Egyptians used the fertile floodplain soil to grow food.'},
  {cat:'water',label:'Water & Land',q:'What happens to vegetation during a drought?',sub:'',a:'It dies or becomes damaged because there is not enough water',ex:'Without water, soil dries out, crops fail, and ecosystems collapse.'},
  {cat:'water',label:'Water & Land',q:'Name 3 ways humans pollute water.',sub:'',a:'Throwing rubbish into rivers/oceans, pouring oils down drains, dumping factory chemicals in water',ex:'Oil spills from ships are another major cause of water contamination.'},
  {cat:'water',label:'Water & Land',q:'How does oil pollution damage marine life?',sub:'',a:'Oil spreads over water and suffocates sea animals, birds and plants — causing massive death',ex:'Oil spills are catastrophic. They can take years to heal because oil coats everything in the water.'},
  {cat:'water',label:'Water & Land',q:'Name 2 things kids can do to protect water.',sub:'',a:'Never throw rubbish into rivers or seas; don\'t pour oils or chemicals down drains',ex:'You can also encourage family and friends to adopt better habits. Small actions add up!'},
  {cat:'water',label:'Water & Land',q:'Why is water described as "imperative for life"?',sub:'',a:'Without water, no plants, animals or humans can survive',ex:'Every living thing on Earth needs water. It\'s not optional — it\'s the foundation of all life.'},
  {cat:'water',label:'Water & Land',q:'What happens when factories dump chemical waste into rivers?',sub:'',a:'The water becomes extremely contaminated, killing aquatic animals and plants',ex:'Chemical waste can make entire rivers "dead zones" where no life can survive.'},
  {cat:'water',label:'Water & Land',q:'Why does oil from ships cause so much damage to oceans?',sub:'',a:'Oil floats on water and spreads quickly, blocking sunlight and oxygen for sea life',ex:'Even after the oil is cleaned, the damage to ecosystems can last for decades.'},

  // HYDROPOWER (10)
  {cat:'hydropower',label:'Hydropower',q:'What is hydropower?',sub:'',a:'Energy generated from moving or falling water, used to produce electricity',ex:'Hydropower is one of the oldest and cleanest forms of energy. It uses the force of water, not fuels.'},
  {cat:'hydropower',label:'Hydropower',q:'Is hydropower a renewable energy source?',sub:'',a:'Yes — water is never used up, so hydropower is renewable',ex:'Unlike coal or oil, water keeps flowing. As long as rain falls and rivers flow, hydropower works.'},
  {cat:'hydropower',label:'Hydropower',q:'What is a turbine?',sub:'Hydropower plant',a:'A wheel with blades that spins when water flows through it, converting water movement into mechanical energy',ex:'The turbine is the key part — falling water pushes its blades, making it spin.'},
  {cat:'hydropower',label:'Hydropower',q:'What is a generator?',sub:'Hydropower plant',a:'A machine that converts the spinning movement of the turbine into electricity',ex:'Turbine spins → powers the generator → generator produces electricity.'},
  {cat:'hydropower',label:'Hydropower',q:'What is the role of a dam in hydropower?',sub:'',a:'It holds back water to create a reservoir at a high elevation, controlling when and how much water flows through',ex:'The higher the water and the more that flows, the more electricity the plant can generate.'},
  {cat:'hydropower',label:'Hydropower',q:'What is the correct order of how a hydropower plant works?',sub:'',a:'Dam stores water → water flows down pipes → spins turbine → turbine powers generator → electricity produced',ex:'The key is the FALL of water — higher elevation means more energy.'},
  {cat:'hydropower',label:'Hydropower',q:'Name 2 environmental ADVANTAGES of hydropower.',sub:'',a:'No carbon dioxide or greenhouse gases; renewable — water is never consumed',ex:'Clean electricity with no air pollution. A much better option than burning coal or oil!'},
  {cat:'hydropower',label:'Hydropower',q:'Name 2 environmental DISADVANTAGES of hydropower.',sub:'',a:'Dam blocks fish migration; reservoir floods natural land, homes and habitats',ex:'Hydropower is clean but not perfect — it can seriously harm river ecosystems.'},
  {cat:'hydropower',label:'Hydropower',q:'How does a dam affect fish?',sub:'',a:'It blocks their natural migration routes — fish cannot move up or downstream to breed',ex:'Many fish species travel up rivers to lay eggs. A dam can prevent this and reduce populations.'},
  {cat:'hydropower',label:'Hydropower',q:'Why can droughts be a problem for hydropower plants?',sub:'',a:'Less rainfall = less water in the reservoir = less power that can be generated',ex:'Hydropower depends on water flow. In a severe drought, the dam can\'t generate enough electricity.'},
];

var cards=allCards.slice(),currentIndex=0,showingAnswer=false,currentFilter='all';
var knownSet=new Set(),reviewSet=new Set();
var flashcard=document.getElementById('flashcard'),cardLabel=document.getElementById('cardLabel'),cardCounter=document.getElementById('cardCounter'),cardContent=document.getElementById('cardContent'),cardHint=document.getElementById('cardHint'),catBadge=document.getElementById('catBadge'),progressText=document.getElementById('progressText'),progressFill=document.getElementById('progressFill'),statGood=document.getElementById('statGood'),statReview=document.getElementById('statReview'),statLeft=document.getElementById('statLeft'),finishedScreen=document.getElementById('finishedScreen'),finishedStats=document.getElementById('finishedStats');
function getId(c){return c.cat+'::'+c.q;}
function renderFront(c){cardContent.innerHTML='<div class="card-prompt">'+c.q+'</div>'+(c.sub?'<div class="card-sub">'+c.sub+'</div>':'');cardHint.textContent='👆 tap to see answer';flashcard.classList.remove('is-back');}
function renderBack(c){cardContent.innerHTML='<div class="card-answer">'+c.a+'</div>'+(c.ex?'<div class="card-example">'+c.ex+'</div>':'');cardHint.textContent='👆 tap to see question';flashcard.classList.add('is-back');}
function renderCard(){if(!cards.length){cardContent.innerHTML='<div class="card-prompt">🎉</div><div class="card-sub">No cards match this filter!</div>';cardLabel.textContent='';cardCounter.textContent='';cardHint.textContent='';return;}var c=cards[currentIndex];showingAnswer=false;cardLabel.textContent=c.label;cardCounter.textContent=(currentIndex+1)+'/'+cards.length;renderFront(c);var cats={hydrosphere:'Hydrosphere',cycle:'Water Cycle',water:'Water & Land',hydropower:'Hydropower'};catBadge.textContent=cats[c.cat]||c.cat;progressText.textContent=(currentIndex+1)+' / '+cards.length;progressFill.style.width=((currentIndex+1)/cards.length*100)+'%';updateStats();}
function toggleAnswer(){if(!cards.length)return;var c=cards[currentIndex];if(!c||c.cat==='info')return;flashcard.classList.add('fading');setTimeout(function(){showingAnswer=!showingAnswer;if(showingAnswer)renderBack(c);else renderFront(c);flashcard.classList.remove('fading');},120);}
function updateStats(){statGood.textContent=knownSet.size;statReview.textContent=reviewSet.size;statLeft.textContent=Math.max(0,allCards.length-knownSet.size);}
function nextCard(){if(currentIndex<cards.length-1){currentIndex++;renderCard();}else showFinished();}
function prevCard(){if(currentIndex>0){currentIndex--;renderCard();}}
function showFinished(){flashcard.style.display='none';document.querySelector('.controls').style.display='none';finishedScreen.classList.add('show');finishedStats.innerHTML='✅ <strong>'+knownSet.size+'</strong> mastered<br>🔁 <strong>'+reviewSet.size+'</strong> to review';}
function restart(){currentIndex=0;flashcard.style.display='';document.querySelector('.controls').style.display='';finishedScreen.classList.remove('show');applyFilter(currentFilter);}
function shuffle(){for(var i=cards.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=cards[i];cards[i]=cards[j];cards[j]=t;}currentIndex=0;renderCard();}
function applyFilter(f){currentFilter=f;document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.toggle('active',b.dataset.filter===f);});if(f==='all')cards=allCards.slice();else if(f==='review'){cards=allCards.filter(function(c){return reviewSet.has(getId(c));});if(!cards.length)cards=[{cat:'info',label:'',q:'😊',sub:'No cards marked for review yet!',a:'',ex:''}];}else cards=allCards.filter(function(c){return c.cat===f;});currentIndex=0;renderCard();}
flashcard.addEventListener('click',toggleAnswer);
flashcard.addEventListener('keydown',function(e){if(e.key===' '||e.key==='Enter'){e.preventDefault();toggleAnswer();}});
document.getElementById('nextBtn').addEventListener('click',function(e){e.stopPropagation();nextCard();});
document.getElementById('prevBtn').addEventListener('click',function(e){e.stopPropagation();prevCard();});
document.getElementById('gotItBtn').addEventListener('click',function(e){e.stopPropagation();if(!cards.length||cards[currentIndex].cat==='info')return;var id=getId(cards[currentIndex]);knownSet.add(id);reviewSet.delete(id);nextCard();});
document.getElementById('reviewBtn').addEventListener('click',function(e){e.stopPropagation();if(!cards.length||cards[currentIndex].cat==='info')return;var id=getId(cards[currentIndex]);reviewSet.add(id);knownSet.delete(id);nextCard();});
document.getElementById('shuffleBtn').addEventListener('click',shuffle);
document.getElementById('resetBtn').addEventListener('click',function(){if(confirm('Reset all progress?')){knownSet.clear();reviewSet.clear();applyFilter('all');}});
document.getElementById('restartBtn').addEventListener('click',restart);
document.querySelectorAll('.filter-btn').forEach(function(btn){btn.addEventListener('click',function(){applyFilter(btn.dataset.filter);});});
document.addEventListener('keydown',function(e){if(e.target===flashcard)return;if(e.key==='ArrowRight')nextCard();else if(e.key==='ArrowLeft')prevCard();else if(e.key===' '){e.preventDefault();toggleAnswer();}});
document.querySelector('[data-filter="all"]').textContent='All ('+allCards.length+')';
renderCard();
</script>
</body>
</html>
