<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Science — Quiz | Hydrosphere & Hydropower</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900&family=DM+Sans:wght@400;500;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{--paper:#fef9ec;--ink:#1a1a2e;--red:#e63946;--yellow:#ffbe0b;--blue:#3a86ff;--green:#06a77d;--sky:#38b6ff;--purple:#7209b7;--teal:#0096a0;--shadow:5px 5px 0 var(--ink)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;padding:20px 16px 48px;background-image:radial-gradient(circle at 15% 10%,rgba(56,182,255,.15) 0%,transparent 40%),radial-gradient(circle at 85% 85%,rgba(0,150,160,.12) 0%,transparent 40%)}
.container{max-width:680px;margin:0 auto}
header{text-align:center;margin-bottom:24px;padding:20px 20px 16px;background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:var(--shadow);position:relative}
header::before{content:'💧';position:absolute;top:-16px;left:20px;font-size:34px;transform:rotate(-10deg)}
header::after{content:'⚡';position:absolute;top:-16px;right:20px;font-size:34px;transform:rotate(10deg)}
h1{font-family:'Fraunces',serif;font-size:clamp(1.4rem,5vw,2rem);font-weight:900;line-height:1}
h1 .accent{color:var(--sky);font-style:italic}
.subtitle{font-family:'Caveat',cursive;font-size:1.2rem;color:var(--blue);margin-top:4px}
.progress-wrap{display:flex;align-items:center;gap:10px;margin-bottom:18px;font-weight:700;font-size:.9rem}
.progress-bar{flex:1;height:12px;background:#e8e8e8;border:2px solid var(--ink);border-radius:20px;overflow:hidden}
.progress-fill{height:100%;background:var(--sky);width:0%;transition:width .4s}
.question-card{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:22px 18px 18px;box-shadow:var(--shadow);margin-bottom:14px}
.q-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.q-number{font-family:'Fraunces',serif;font-size:1rem;font-weight:900;background:var(--ink);color:var(--paper);padding:2px 10px;border-radius:20px}
.q-tag{font-size:.72rem;font-weight:700;padding:3px 10px;border:2px solid var(--ink);border-radius:20px;background:var(--yellow);text-transform:uppercase;letter-spacing:.4px}
.q-passage{background:#e6f6ff;border-left:4px solid var(--sky);padding:10px 13px;border-radius:6px;font-size:.91rem;line-height:1.6;margin-bottom:14px;font-style:italic}
.q-text{font-size:1.03rem;font-weight:700;line-height:1.4;margin-bottom:16px}
.options{display:flex;flex-direction:column;gap:9px}
.option{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;border:2px solid #ccc;border-radius:12px;cursor:pointer;background:#fafafa;transition:all .15s;font-size:.95rem;font-weight:500;text-align:left;width:100%;font-family:'DM Sans',sans-serif;line-height:1.4}
.option:hover:not(.locked){border-color:var(--sky);background:#e6f6ff;transform:translateX(3px)}
.option .letter{font-family:'Fraunces',serif;font-weight:900;font-size:.95rem;min-width:24px;height:24px;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink);border-radius:50%;background:#fff;flex-shrink:0;margin-top:1px}
.option.locked{cursor:default}
.option.correct{border-color:var(--green);background:#e6fff6}
.option.correct .letter{background:var(--green);color:#fff;border-color:var(--green)}
.option.wrong{border-color:var(--red);background:#fff0f0}
.option.wrong .letter{background:var(--red);color:#fff;border-color:var(--red)}
.option.show-ok{border-color:var(--green);background:#e6fff6;opacity:.55}
.feedback{display:none;margin-top:12px;padding:11px 13px;border-radius:10px;font-size:.91rem;line-height:1.5;border:2px solid}
.feedback.show{display:block}
.feedback.correct{background:#e6fff6;border-color:var(--green);color:#054f35}
.feedback.wrong{background:#fff0f0;border-color:var(--red);color:#7a1010}
.btn-next{display:none;margin-top:12px;width:100%;font-family:'DM Sans',sans-serif;font-size:1rem;font-weight:700;padding:13px;border:3px solid var(--ink);border-radius:12px;background:var(--sky);color:#fff;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:all .1s}
.btn-next:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn-next.show{display:block}
.results{display:none;text-align:center;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:32px 22px;box-shadow:var(--shadow)}
.results.show{display:block}
.results .big-emoji{font-size:3.8rem;display:block;margin-bottom:8px}
.results h2{font-family:'Fraunces',serif;font-size:1.9rem;font-weight:900;margin-bottom:8px}
.score-display{font-family:'Fraunces',serif;font-size:3.2rem;font-weight:900;color:var(--sky);margin:10px 0}
.score-label{font-family:'Caveat',cursive;font-size:1.2rem;color:#666;margin-bottom:18px}
.result-breakdown{display:flex;justify-content:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.result-item{text-align:center;padding:9px 16px;border:2px solid var(--ink);border-radius:12px;background:var(--paper)}
.r-val{font-family:'Fraunces',serif;font-size:1.5rem;font-weight:900;display:block}
.r-val.green{color:var(--green)}.r-val.red{color:var(--red)}
.r-label{font-size:.78rem;font-weight:700}
.wrong-list{text-align:left;background:#fff8f8;border:2px solid var(--red);border-radius:12px;padding:13px 15px;margin-bottom:18px;font-size:.88rem;line-height:1.7}
.wrong-list h3{font-family:'Fraunces',serif;font-size:.95rem;color:var(--red);margin-bottom:7px}
.btn-restart{font-family:'DM Sans',sans-serif;font-size:1rem;font-weight:700;padding:12px 26px;border:3px solid var(--ink);border-radius:12px;background:var(--green);color:#fff;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
</style>
</head>
<body>
<div class="container">
<header>
  <h1><span class="accent">Science</span> Quiz</h1>
  <p class="subtitle">15 questions — go for it, Y5! 💪</p>
</header>
<div class="progress-wrap">
  <span id="progressLabel">Question 1 of 15</span>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
</div>
<div id="quizArea"></div>
<div class="results" id="resultsScreen"></div>
</div>
<script>
var questions=[
  // HYDROSPHERE (4)
  {tag:'Hydrosphere',q:'What is the hydrosphere?',opts:['All the land on Earth\'s surface','All the gases surrounding Earth','All the water found on, under and above Earth\'s surface','The solid rock layer inside the Earth'],c:2,why:'The hydrosphere is ALL water on Earth — in every form and location: oceans, rivers, glaciers, groundwater and water vapour.'},
  {tag:'Hydrosphere',q:'About what percentage of Earth\'s surface is covered by water?',opts:['25%','50%','75%','90%'],c:2,why:'About 75% (three quarters) of Earth\'s surface is water — that\'s why it\'s called the Blue Planet!'},
  {tag:'Hydrosphere',passage:'Earth contains approximately 1.4 billion cubic kilometres of water. However, 97.5% of this is saltwater in the oceans.',q:'What percentage of Earth\'s water is fresh water?',opts:['97.5%','50%','25%','2.5%'],c:3,why:'Only 2.5% of Earth\'s water is fresh — and most of that is frozen in glaciers. Less than 1% is easily available for living things to use.'},
  {tag:'Hydrosphere',q:'In which THREE forms can water exist in the hydrosphere?',opts:['Hot, warm and cold','Liquid, solid and gas','Blue, white and clear','Shallow, deep and frozen'],c:1,why:'Water exists as liquid (oceans, rivers), solid (ice and glaciers) and gas (water vapour in the atmosphere).'},

  // WATER CYCLE (4)
  {tag:'Water Cycle',q:'What is EVAPORATION in the water cycle?',opts:['Water falling from clouds as rain','Water vapour cooling to form clouds','The Sun heating water until it turns into water vapour and rises','Water seeping into the ground'],c:2,why:'Evaporation = Sun heats liquid water → water becomes vapour → rises into the atmosphere. The Sun powers this process.'},
  {tag:'Water Cycle',q:'What is CONDENSATION?',opts:['Water flowing over land into rivers','Water vapour cooling and turning into liquid droplets that form clouds','Water soaking into the ground','Snow turning directly into vapour'],c:1,why:'Condensation is the opposite of evaporation. Water vapour rises, cools, and turns back into tiny liquid droplets — forming clouds.'},
  {tag:'Water Cycle',passage:'After heavy rain, some water flows into rivers, some soaks into the ground, and some evaporates back into the air.',q:'What is the term for water that soaks into the ground?',opts:['Precipitation','Condensation','Infiltration','Runoff'],c:2,why:'Infiltration = water percolates down through the soil into the ground, becoming groundwater. Runoff is the water that flows over the surface.'},
  {tag:'Water Cycle',q:'Why does rain water taste fresh, even though most of it originally evaporated from salty oceans?',opts:['Because the ocean makes the water fresh before it evaporates','Because evaporation leaves salt and impurities behind — only pure water vapour rises','Because clouds filter out the salt','Because rivers add fresh water to the cycle'],c:1,why:'Evaporation purifies water! Salt and impurities cannot evaporate — only the water molecules rise as vapour, leaving the salt behind.'},

  // WATER & LAND (4)
  {tag:'Water & Land',passage:'A factory has been pouring its chemical waste directly into a nearby river for several years.',q:'What is the most likely impact on the river ecosystem?',opts:['The river will become cleaner over time','Fish and aquatic plants will thrive in the new environment','The water will become extremely contaminated, killing aquatic life','The chemicals will make the river flow faster'],c:2,why:'Chemical waste contaminates water, removing oxygen and killing fish, plants and other aquatic organisms. It can create "dead zones" in rivers.'},
  {tag:'Water & Land',q:'How does the flow of rivers impact the land?',opts:['Rivers only affect the water, not the land','Rivers shape valleys, erode soil and deposit sediments that enrich the land','Rivers increase the amount of salt in the soil','Rivers have no long-term impact on vegetation'],c:1,why:'Rivers are powerful forces! Over time they carve valleys, erode rock and carry sediments that deposit nutrients on floodplains, making soil very fertile.'},
  {tag:'Water & Land',q:'Which of these is a POSITIVE impact of flooding on land?',opts:['It always destroys crops and vegetation','It deposits nutrient-rich sediments that can make soil very fertile','It permanently removes water from an area','It increases drought in nearby regions'],c:1,why:'Floods can deposit rich sediments on floodplains — ancient civilizations like Egypt relied on Nile flooding to fertilize their farmland.'},
  {tag:'Water & Land',q:'What is the BEST action to help protect water from pollution?',opts:['Pour cooking oils and paints down the drain — they dilute in water','Never throw rubbish, oils or chemicals into rivers, drains or seas','Only use bottled water so rivers stay natural','Stop using water completely to save it'],c:1,why:'The most important actions: never throw rubbish into water, never pour oils/chemicals down drains, and encourage others to do the same.'},

  // HYDROPOWER (3)
  {tag:'Hydropower',q:'How does a hydroelectric power plant generate electricity?',opts:['By burning water as a fuel','By using wind to spin turbines near dams','By using falling water to spin turbines connected to generators','By converting sunlight into electricity through water'],c:2,why:'Falling water pushes turbine blades → turbine spins → powers a generator → generator produces electricity. The key is the FALL of water from high to low.'},
  {tag:'Hydropower',q:'Which of the following is an environmental DISADVANTAGE of hydropower?',opts:['It produces large amounts of carbon dioxide','It is too expensive to build','Dams can block fish migration routes and flood natural habitats','It uses too much water and empties the rivers'],c:2,why:'Hydropower produces no greenhouse gases (a big advantage), but dams block fish migration, flood natural areas and change river ecosystems (disadvantages).'},
  {tag:'Hydropower',passage:'Hydropower is a renewable energy source that produces almost no carbon dioxide.',q:'Despite being clean, why might some communities oppose building a hydropower dam?',opts:['Because it produces dangerous radiation','Because the reservoir can flood homes, farmland and natural habitats','Because hydropower is more expensive than coal','Because dams make the water too cold for swimming'],c:1,why:'Dams create large reservoirs that can flood entire valleys, displacing communities, destroying farmland and submerging archaeological sites and ecosystems.'},
];

var currentQ=0,score=0,wrongQuestions=[],answered=false;
function renderQuestion(){
  var q=questions[currentQ];answered=false;
  document.getElementById('progressFill').style.width=(currentQ/questions.length*100)+'%';
  document.getElementById('progressLabel').textContent='Question '+(currentQ+1)+' of '+questions.length;
  var letters=['A','B','C','D'];
  var passHTML=q.passage?'<div class="q-passage">'+q.passage+'</div>':'';
  var optsHTML=q.opts.map(function(o,i){return '<button class="option" data-index="'+i+'"><span class="letter">'+letters[i]+'</span><span>'+o+'</span></button>';}).join('');
  document.getElementById('quizArea').innerHTML='<div class="question-card"><div class="q-meta"><span class="q-number">Q'+(currentQ+1)+'</span><span class="q-tag">'+q.tag+'</span></div>'+passHTML+'<div class="q-text">'+q.q+'</div><div class="options">'+optsHTML+'</div><div class="feedback" id="feedback"></div><button class="btn-next" id="btnNext">'+(currentQ<questions.length-1?'Next question →':'See results 🎉')+'</button></div>';
  document.querySelectorAll('.option').forEach(function(btn){btn.addEventListener('click',function(){if(answered)return;selectAnswer(parseInt(btn.dataset.index));});});
  document.getElementById('btnNext').addEventListener('click',function(){currentQ++;if(currentQ<questions.length)renderQuestion();else showResults();});
}
function selectAnswer(chosen){
  answered=true;var q=questions[currentQ];var isCorrect=chosen===q.c;var letters=['A','B','C','D'];
  if(isCorrect)score++;else wrongQuestions.push({n:currentQ+1,text:q.q,correct:letters[q.c]+') '+q.opts[q.c]});
  document.querySelectorAll('.option').forEach(function(btn,i){btn.classList.add('locked');if(i===q.c&&i===chosen)btn.classList.add('correct');else if(i===chosen)btn.classList.add('wrong');else if(i===q.c)btn.classList.add('show-ok');});
  var fb=document.getElementById('feedback');fb.classList.add('show');fb.classList.add(isCorrect?'correct':'wrong');
  fb.innerHTML='<strong>'+(isCorrect?'✅ Correct!':'❌ Not quite.')+'</strong> '+q.why;
  document.getElementById('btnNext').classList.add('show');
}
function showResults(){
  document.getElementById('quizArea').style.display='none';document.getElementById('progressLabel').parentElement.style.display='none';
  var pct=Math.round(score/questions.length*100);var emoji,msg;
  if(pct>=90){emoji='🏆';msg='Outstanding! You\'re ready for the test!';}
  else if(pct>=70){emoji='🌟';msg='Great job! Review the topics below and you\'ll ace it!';}
  else if(pct>=50){emoji='💪';msg='Good effort! Study the topics below and try again.';}
  else{emoji='📚';msg='Keep studying! Review the sheet and flashcards, then try again.';}
  var wrongHTML='';
  if(wrongQuestions.length){wrongHTML='<div class="wrong-list"><h3>⚠️ Review these topics:</h3>';wrongQuestions.forEach(function(w){wrongHTML+='<div>Q'+w.n+': '+w.text+'<br><strong>✓ '+w.correct+'</strong></div><br>';});wrongHTML+='</div>';}
  var rs=document.getElementById('resultsScreen');
  rs.innerHTML='<span class="big-emoji">'+emoji+'</span><h2>'+msg+'</h2><div class="score-display">'+score+' / '+questions.length+'</div><div class="score-label">'+pct+'% correct</div><div class="result-breakdown"><div class="result-item"><span class="r-val green">'+score+'</span><span class="r-label">Correct</span></div><div class="result-item"><span class="r-val red">'+wrongQuestions.length+'</span><span class="r-label">Wrong</span></div><div class="result-item"><span class="r-val" style="color:var(--sky)">'+pct+'%</span><span class="r-label">Score</span></div></div>'+wrongHTML+'<button class="btn-restart" id="btnRestart">Try again 🔁</button>';
  rs.classList.add('show');
  document.getElementById('btnRestart').addEventListener('click',function(){currentQ=0;score=0;wrongQuestions=[];answered=false;document.getElementById('quizArea').style.display='';document.getElementById('progressLabel').parentElement.style.display='';rs.classList.remove('show');renderQuestion();});
}
renderQuestion();
</script>
</body>
</html>
