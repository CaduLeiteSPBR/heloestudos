<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matemática — Flashcards | 2º Tri</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900&family=DM+Sans:wght@400;500;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{--paper:#fef9ec;--ink:#1a1a2e;--red:#e63946;--yellow:#ffbe0b;--blue:#3a86ff;--green:#06a77d;--purple:#7209b7;--orange:#f4721e;--shadow:6px 6px 0 var(--ink)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;padding:20px 16px 40px;background-image:radial-gradient(circle at 20% 10%,rgba(244,114,30,.15) 0%,transparent 40%),radial-gradient(circle at 90% 80%,rgba(58,134,255,.12) 0%,transparent 40%)}
.container{max-width:700px;margin:0 auto}
header{text-align:center;margin-bottom:22px}
h1{font-family:'Fraunces',serif;font-size:clamp(1.5rem,5vw,2.1rem);font-weight:900;line-height:1}
h1 .accent{color:var(--orange);font-style:italic}
.subtitle{font-family:'Caveat',cursive;font-size:1.25rem;color:var(--blue);margin-top:4px}
.top-bar{display:flex;justify-content:space-between;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px 14px;box-shadow:3px 3px 0 var(--ink);margin-bottom:14px;font-size:.9rem;font-weight:700;flex-wrap:wrap;gap:8px}
.progress{display:flex;align-items:center;gap:8px}
.progress-bar{width:100px;height:10px;background:#eee;border:2px solid var(--ink);border-radius:20px;overflow:hidden}
.progress-fill{height:100%;background:var(--green);width:0%;transition:width .4s}
.cat-badge{padding:3px 10px;border:2px solid var(--ink);border-radius:20px;font-size:.75rem;background:var(--yellow);text-transform:uppercase;letter-spacing:.5px}
.filters{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.filter-btn{font-family:'DM Sans',sans-serif;font-size:.78rem;font-weight:700;padding:5px 11px;border:2px solid var(--ink);border-radius:20px;background:#fff;cursor:pointer;transition:all .15s}
.filter-btn.active{background:var(--ink);color:var(--paper)}
.flashcard{width:100%;min-height:320px;border:3px solid var(--ink);border-radius:20px;box-shadow:var(--shadow);padding:44px 22px 40px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:linear-gradient(135deg,#fff 0%,#fff8ee 100%);cursor:pointer;position:relative;margin-bottom:18px;transition:background .25s ease,opacity .15s ease;user-select:none;-webkit-user-select:none}
.flashcard.is-back{background:linear-gradient(135deg,#fff 0%,#e6f4ff 100%)}
.flashcard.fading{opacity:0}
.card-label{position:absolute;top:13px;left:16px;font-family:'Caveat',cursive;font-size:.95rem;color:var(--purple);font-weight:700}
.card-counter{position:absolute;top:13px;right:16px;font-size:.78rem;color:#888;font-weight:700}
.card-hint{position:absolute;bottom:13px;left:50%;transform:translateX(-50%);font-family:'Caveat',cursive;font-size:.95rem;color:#999;white-space:nowrap}
.card-content{width:100%}
.card-prompt{font-family:'Fraunces',serif;font-size:clamp(1.1rem,3.8vw,1.6rem);font-weight:900;line-height:1.3;margin-bottom:10px}
.card-sub{font-size:.92rem;color:#666;font-style:italic;line-height:1.4}
.card-answer{font-family:'Fraunces',serif;font-size:clamp(1.1rem,3.8vw,1.6rem);font-weight:900;color:var(--blue);margin-bottom:10px;line-height:1.3}
.card-example{background:rgba(255,190,11,.25);border-left:3px solid var(--yellow);padding:9px 12px;border-radius:6px;font-size:.88rem;font-style:italic;max-width:95%;margin:0 auto;line-height:1.5}
.card-example strong{color:var(--red);font-style:normal}
.controls{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:10px;margin-bottom:12px}
.btn{font-family:'DM Sans',sans-serif;font-size:1rem;font-weight:700;padding:12px 14px;border:3px solid var(--ink);border-radius:12px;background:#fff;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:all .1s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn-nav{font-size:1.2rem;padding:12px 12px}
.btn-got{background:var(--green);color:#fff}
.btn-rev{background:var(--red);color:#fff}
.tools{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.tool-btn{font-family:'DM Sans',sans-serif;font-size:.83rem;font-weight:700;padding:7px 13px;border:2px solid var(--ink);border-radius:20px;background:#fff;cursor:pointer}
.tool-btn:hover{background:var(--yellow)}
.stats{margin-top:18px;padding:13px;background:#fff;border:3px solid var(--ink);border-radius:14px;display:flex;justify-content:space-around;text-align:center;font-size:.83rem}
.stat-value{font-family:'Fraunces',serif;font-size:1.7rem;font-weight:900;display:block}
.stat-value.green{color:var(--green)}.stat-value.red{color:var(--red)}.stat-value.blue{color:var(--blue)}
.finished{text-align:center;padding:36px 20px;background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:var(--shadow);display:none}
.finished.show{display:block}
.finished h2{font-family:'Fraunces',serif;font-size:1.9rem;color:var(--green);margin-bottom:10px}
.finished .big{font-size:3.5rem;display:block;margin-bottom:8px}
@media(max-width:480px){.controls{grid-template-columns:1fr 1fr}.btn-nav{grid-column:span 1}.flashcard{min-height:300px;padding:40px 16px 38px}}
</style>
</head>
<body>
<div class="container">
<header>
  <h1>Mate<span class="accent">mática</span> — Flashcards</h1>
  <p class="subtitle">Toque no card para ver a resposta! 🎴</p>
</header>
<div class="top-bar">
  <div class="progress"><span id="progressText">1 / 40</span><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div></div>
  <div class="cat-badge" id="catBadge">Decimais</div>
</div>
<div class="filters">
  <button class="filter-btn active" data-filter="all">Todos (40)</button>
  <button class="filter-btn" data-filter="decimais">🔢 Decimais</button>
  <button class="filter-btn" data-filter="fracoes">➗ Frações</button>
  <button class="filter-btn" data-filter="mmc">📊 MMC</button>
  <button class="filter-btn" data-filter="area">📐 Área e Perímetro</button>
  <button class="filter-btn" data-filter="review">⚠️ Revisar</button>
</div>
<div class="flashcard" id="flashcard" role="button" tabindex="0">
  <div class="card-label" id="cardLabel">Decimais</div>
  <div class="card-counter" id="cardCounter">1/40</div>
  <div class="card-content" id="cardContent"></div>
  <div class="card-hint" id="cardHint">👆 toque para ver a resposta</div>
</div>
<div class="controls">
  <button class="btn btn-nav" id="prevBtn">◀</button>
  <button class="btn btn-rev" id="reviewBtn">Revisar de novo</button>
  <button class="btn btn-got" id="gotItBtn">Acertei! ✓</button>
  <button class="btn btn-nav" id="nextBtn">▶</button>
</div>
<div class="tools">
  <button class="tool-btn" id="shuffleBtn">🔀 Embaralhar</button>
  <button class="tool-btn" id="resetBtn">↺ Resetar</button>
</div>
<div class="stats">
  <div><span class="stat-value green" id="statGood">0</span><span>Acertei</span></div>
  <div><span class="stat-value red" id="statReview">0</span><span>Revisar</span></div>
  <div><span class="stat-value blue" id="statLeft">40</span><span>Faltam</span></div>
</div>
<div class="finished" id="finishedScreen">
  <span class="big">🎉</span>
  <h2>Arrasou, Year 5!</h2>
  <p style="margin-bottom:14px">Você revisou todos os cards.</p>
  <p id="finishedStats" style="margin-bottom:20px"></p>
  <button class="btn" id="restartBtn" style="background:var(--blue);color:#fff">Recomeçar 🔁</button>
</div>
</div>
<script>
var allCards=[
  // DECIMAIS (10)
  {cat:'decimais',label:'Números Decimais',q:'O que é um número decimal?',sub:'',a:'Um número com vírgula que representa uma quantidade entre dois números inteiros',ex:'<strong>5,75</strong> está entre 5 e 6. Aparece em preços, pesos, temperaturas...'},
  {cat:'decimais',label:'Números Decimais',q:'Na casa decimal, o que significa o primeiro dígito após a vírgula?',sub:'',a:'Décimos (cada unidade = 0,1)',ex:'Em 3,<strong>4</strong>7 → o 4 está na casa dos <strong>décimos</strong> → vale 0,4'},
  {cat:'decimais',label:'Números Decimais',q:'Na casa decimal, o que significa o segundo dígito após a vírgula?',sub:'',a:'Centésimos (cada unidade = 0,01)',ex:'Em 3,4<strong>7</strong> → o 7 está na casa dos <strong>centésimos</strong> → vale 0,07'},
  {cat:'decimais',label:'Números Decimais',q:'Como se lê o número 5,3?',sub:'',a:'"Cinco e três décimos"',ex:'5,3 = 5 inteiros + 3 décimos = 5 + 0,3'},
  {cat:'decimais',label:'Números Decimais',q:'Compare: 3,45 e 3,5. Qual é maior?',sub:'',a:'3,5 é maior que 3,45',ex:'Parte inteira igual (3). Décimos: 4 &lt; 5 → <strong>3,5 &gt; 3,45</strong>'},
  {cat:'decimais',label:'Números Decimais',q:'Ordene do menor ao maior: 1,2 / 1,25 / 1,09',sub:'',a:'1,09 → 1,2 → 1,25',ex:'Compare os décimos: 0 &lt; 2 → 1,09 vem primeiro. Depois 1,20 &lt; 1,25.'},
  {cat:'decimais',label:'Números Decimais',q:'Calcule: 5,75 + 2,3',sub:'Alinhe as vírgulas!',a:'8,05',ex:'5,75 + 2,30 = <strong>8,05</strong>. Preencha com zero: 2,3 → 2,30'},
  {cat:'decimais',label:'Números Decimais',q:'Calcule: 7,4 − 3,18',sub:'',a:'4,22',ex:'7,40 − 3,18 = <strong>4,22</strong>. Complete com zero: 7,4 → 7,40'},
  {cat:'decimais',label:'Números Decimais',q:'Qual a regra mais importante para somar decimais?',sub:'',a:'Alinhar as vírgulas e completar com zeros onde faltar dígito',ex:'3,5 + 1,27 → 3,50 + 1,27 = 4,77. Sem alinhar a vírgula, o resultado fica errado!'},
  {cat:'decimais',label:'Números Decimais',q:'Como converter a fração 3/4 em decimal?',sub:'',a:'Divida o numerador pelo denominador: 3 ÷ 4 = 0,75',ex:'3 ÷ 4 = <strong>0,75</strong>. Frações e decimais são formas diferentes do mesmo valor.'},

  // FRAÇÕES (10)
  {cat:'fracoes',label:'Frações e Racionais',q:'O que são números racionais positivos?',sub:'',a:'São todos os números que podem ser escritos como fração (positivos) — inclui inteiros e decimais',ex:'2, 3/4, 0,5, 1,25 — todos são racionais positivos.'},
  {cat:'fracoes',label:'Frações e Racionais',q:'Como representar 0,5 como fração?',sub:'',a:'1/2',ex:'0,5 = 5/10 = <strong>1/2</strong>. Um meio é o mesmo que cinquenta centésimos.'},
  {cat:'fracoes',label:'Frações e Racionais',q:'Como representar 0,25 como fração?',sub:'',a:'1/4',ex:'0,25 = 25/100 = <strong>1/4</strong>. Um quarto de qualquer coisa = 25%.'},
  {cat:'fracoes',label:'Frações e Racionais',q:'Como representar 0,75 como fração?',sub:'',a:'3/4',ex:'0,75 = 75/100 = <strong>3/4</strong>. Três quartos.'},
  {cat:'fracoes',label:'Frações e Racionais',q:'Compare: 1/2 e 2/5. Qual é maior?',sub:'Use denominador comum',a:'1/2 é maior que 2/5',ex:'MMC(2,5)=10 → 1/2=5/10 e 2/5=4/10 → <strong>5/10 &gt; 4/10</strong>'},
  {cat:'fracoes',label:'Frações e Racionais',q:'Como ordenar frações com denominadores diferentes?',sub:'',a:'Calcule o MMC, converta todas para o mesmo denominador e compare os numeradores',ex:'1/3 e 1/4: MMC=12 → 4/12 e 3/12 → 1/3 &gt; 1/4'},
  {cat:'fracoes',label:'Frações e Racionais',q:'O que é uma fração equivalente?',sub:'',a:'Frações com valores iguais mas numeradores e denominadores diferentes',ex:'1/2 = 2/4 = 3/6 = 4/8 — todas valem o mesmo (metade)!'},
  {cat:'fracoes',label:'Frações e Racionais',q:'Como representar 1,25 como número misto?',sub:'',a:'1 e 1/4 (um inteiro e um quarto)',ex:'1,25 = 1 + 0,25 = 1 + 1/4 = <strong>1¼</strong>'},
  {cat:'fracoes',label:'Frações e Racionais',q:'Qual é maior: 2/3 ou 3/5?',sub:'',a:'2/3 é maior',ex:'MMC(3,5)=15 → 2/3=10/15 e 3/5=9/15 → <strong>10/15 &gt; 9/15</strong>'},
  {cat:'fracoes',label:'Frações e Racionais',q:'Como converter 0,1 em fração?',sub:'',a:'1/10 (um décimo)',ex:'0,1 = 1 décimo = <strong>1/10</strong>. A posição decimal diz o denominador!'},

  // MMC (10)
  {cat:'mmc',label:'MMC e Frações',q:'O que é MMC?',sub:'',a:'Mínimo Múltiplo Comum — o menor número que é múltiplo de dois ou mais números ao mesmo tempo',ex:'MMC(3,4) = 12, pois 12 é o menor número que 3 e 4 dividem exatamente.'},
  {cat:'mmc',label:'MMC e Frações',q:'Qual é o MMC de 2 e 3?',sub:'',a:'6',ex:'Múltiplos de 2: 2,4,<strong>6</strong>... / Múltiplos de 3: 3,<strong>6</strong>... → MMC = 6'},
  {cat:'mmc',label:'MMC e Frações',q:'Qual é o MMC de 4 e 6?',sub:'',a:'12',ex:'4=2² e 6=2×3 → MMC = 2² × 3 = <strong>12</strong>'},
  {cat:'mmc',label:'MMC e Frações',q:'Qual é o MMC de 3 e 5?',sub:'',a:'15',ex:'3 e 5 não têm fatores em comum → MMC = 3 × 5 = <strong>15</strong>'},
  {cat:'mmc',label:'MMC e Frações',q:'Para que serve o MMC em frações?',sub:'',a:'Para igualar os denominadores antes de somar ou subtrair frações diferentes',ex:'Não dá somar 1/3 + 1/4 direto. Precisa do MMC(3,4)=12 primeiro.'},
  {cat:'mmc',label:'MMC e Frações',q:'Calcule: 1/3 + 1/4',sub:'Passo a passo',a:'7/12',ex:'MMC(3,4)=12 → 1/3=4/12 e 1/4=3/12 → 4/12+3/12 = <strong>7/12</strong>'},
  {cat:'mmc',label:'MMC e Frações',q:'Calcule: 3/4 − 1/6',sub:'',a:'7/12',ex:'MMC(4,6)=12 → 3/4=9/12 e 1/6=2/12 → 9/12−2/12 = <strong>7/12</strong>'},
  {cat:'mmc',label:'MMC e Frações',q:'Calcule: 1/2 + 1/3',sub:'',a:'5/6',ex:'MMC(2,3)=6 → 1/2=3/6 e 1/3=2/6 → 3/6+2/6 = <strong>5/6</strong>'},
  {cat:'mmc',label:'MMC e Frações',q:'Calcule: 2/3 − 1/4',sub:'',a:'5/12',ex:'MMC(3,4)=12 → 2/3=8/12 e 1/4=3/12 → 8/12−3/12 = <strong>5/12</strong>'},
  {cat:'mmc',label:'MMC e Frações',q:'Calcule: 1/2 + 2/5',sub:'',a:'9/10',ex:'MMC(2,5)=10 → 1/2=5/10 e 2/5=4/10 → 5/10+4/10 = <strong>9/10</strong>'},

  // ÁREA E PERÍMETRO (10)
  {cat:'area',label:'Área e Perímetro',q:'O que é perímetro?',sub:'',a:'A medida do contorno de uma figura — a soma de todos os seus lados',ex:'Pense em uma cerca ao redor de um campo: o perímetro é o tamanho total da cerca.'},
  {cat:'area',label:'Área e Perímetro',q:'O que é área?',sub:'',a:'A medida da superfície interna de uma figura — o espaço que ela ocupa',ex:'Pense em pintar o piso de um quarto: a área é quanto chão você pinta.'},
  {cat:'area',label:'Área e Perímetro',q:'Qual é a fórmula da área do retângulo?',sub:'',a:'Área = base × altura',ex:'Retângulo de 4,5 m × 2 m → Área = 4,5 × 2 = <strong>9 m²</strong>'},
  {cat:'area',label:'Área e Perímetro',q:'Qual é a fórmula da área do quadrado?',sub:'',a:'Área = lado × lado = lado²',ex:'Quadrado de 3,5 m → Área = 3,5 × 3,5 = <strong>12,25 m²</strong>'},
  {cat:'area',label:'Área e Perímetro',q:'Qual é a fórmula da área do triângulo?',sub:'',a:'Área = (base × altura) ÷ 2',ex:'Triângulo com b=6 m e h=4 m → Área = (6×4)÷2 = 24÷2 = <strong>12 m²</strong>'},
  {cat:'area',label:'Área e Perímetro',q:'Qual é a fórmula do perímetro do retângulo?',sub:'',a:'Perímetro = 2 × (base + altura)',ex:'Retângulo 3,5 m × 2,4 m → P = 2×(3,5+2,4) = 2×5,9 = <strong>11,8 m</strong>'},
  {cat:'area',label:'Área e Perímetro',q:'Qual é a fórmula do perímetro do quadrado?',sub:'',a:'Perímetro = 4 × lado',ex:'Quadrado de 2,5 m → P = 4 × 2,5 = <strong>10 m</strong>'},
  {cat:'area',label:'Área e Perímetro',q:'Em que unidade se mede área?',sub:'',a:'Em unidades quadradas: cm², m², km²',ex:'Área usa unidade ao quadrado porque mede duas dimensões (comprimento E largura).'},
  {cat:'area',label:'Área e Perímetro',q:'Um jardim retangular tem 3,5 m × 2,4 m. Qual é a área?',sub:'Situação-problema',a:'8,4 m²',ex:'Área = 3,5 × 2,4 = <strong>8,4 m²</strong>. Aplique a fórmula com os decimais.'},
  {cat:'area',label:'Área e Perímetro',q:'Figuras com mesmo perímetro podem ter áreas diferentes?',sub:'Pense!',a:'Sim! O perímetro (contorno) e a área (superfície) são medidas independentes',ex:'Um quadrado 4×4 (P=16, A=16) e um retângulo 7×1 (P=16, A=7) têm o mesmo perímetro mas áreas diferentes!'},
];

var cards=allCards.slice(),currentIndex=0,showingAnswer=false,currentFilter='all';
var knownSet=new Set(),reviewSet=new Set();
var flashcard=document.getElementById('flashcard'),cardLabel=document.getElementById('cardLabel'),cardCounter=document.getElementById('cardCounter'),cardContent=document.getElementById('cardContent'),cardHint=document.getElementById('cardHint'),catBadge=document.getElementById('catBadge'),progressText=document.getElementById('progressText'),progressFill=document.getElementById('progressFill'),statGood=document.getElementById('statGood'),statReview=document.getElementById('statReview'),statLeft=document.getElementById('statLeft'),finishedScreen=document.getElementById('finishedScreen'),finishedStats=document.getElementById('finishedStats');
function getId(c){return c.cat+'::'+c.q;}
function renderFront(c){cardContent.innerHTML='<div class="card-prompt">'+c.q+'</div>'+(c.sub?'<div class="card-sub">'+c.sub+'</div>':'');cardHint.textContent='👆 toque para ver a resposta';flashcard.classList.remove('is-back');}
function renderBack(c){cardContent.innerHTML='<div class="card-answer">'+c.a+'</div>'+(c.ex?'<div class="card-example">'+c.ex+'</div>':'');cardHint.textContent='👆 toque para ver a pergunta';flashcard.classList.add('is-back');}
function renderCard(){if(!cards.length){cardContent.innerHTML='<div class="card-prompt">🎉</div><div class="card-sub">Nenhum card nesse filtro!</div>';cardLabel.textContent='';cardCounter.textContent='';cardHint.textContent='';return;}var c=cards[currentIndex];showingAnswer=false;cardLabel.textContent=c.label;cardCounter.textContent=(currentIndex+1)+'/'+cards.length;renderFront(c);var cats={decimais:'Decimais',fracoes:'Frações',mmc:'MMC',area:'Área e Perímetro'};catBadge.textContent=cats[c.cat]||c.cat;progressText.textContent=(currentIndex+1)+' / '+cards.length;progressFill.style.width=((currentIndex+1)/cards.length*100)+'%';updateStats();}
function toggleAnswer(){if(!cards.length)return;var c=cards[currentIndex];if(!c||c.cat==='info')return;flashcard.classList.add('fading');setTimeout(function(){showingAnswer=!showingAnswer;if(showingAnswer)renderBack(c);else renderFront(c);flashcard.classList.remove('fading');},120);}
function updateStats(){statGood.textContent=knownSet.size;statReview.textContent=reviewSet.size;statLeft.textContent=Math.max(0,allCards.length-knownSet.size);}
function nextCard(){if(currentIndex<cards.length-1){currentIndex++;renderCard();}else showFinished();}
function prevCard(){if(currentIndex>0){currentIndex--;renderCard();}}
function showFinished(){flashcard.style.display='none';document.querySelector('.controls').style.display='none';finishedScreen.classList.add('show');finishedStats.innerHTML='✅ <strong>'+knownSet.size+'</strong> acertados<br>🔁 <strong>'+reviewSet.size+'</strong> para revisar';}
function restart(){currentIndex=0;flashcard.style.display='';document.querySelector('.controls').style.display='';finishedScreen.classList.remove('show');applyFilter(currentFilter);}
function shuffle(){for(var i=cards.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=cards[i];cards[i]=cards[j];cards[j]=t;}currentIndex=0;renderCard();}
function applyFilter(f){currentFilter=f;document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.toggle('active',b.dataset.filter===f);});if(f==='all')cards=allCards.slice();else if(f==='review'){cards=allCards.filter(function(c){return reviewSet.has(getId(c));});if(!cards.length)cards=[{cat:'info',label:'',q:'😊',sub:'Nenhum card marcado para revisar!',a:'',ex:''}];}else cards=allCards.filter(function(c){return c.cat===f;});currentIndex=0;renderCard();}
flashcard.addEventListener('click',toggleAnswer);
flashcard.addEventListener('keydown',function(e){if(e.key===' '||e.key==='Enter'){e.preventDefault();toggleAnswer();}});
document.getElementById('nextBtn').addEventListener('click',function(e){e.stopPropagation();nextCard();});
document.getElementById('prevBtn').addEventListener('click',function(e){e.stopPropagation();prevCard();});
document.getElementById('gotItBtn').addEventListener('click',function(e){e.stopPropagation();if(!cards.length||cards[currentIndex].cat==='info')return;var id=getId(cards[currentIndex]);knownSet.add(id);reviewSet.delete(id);nextCard();});
document.getElementById('reviewBtn').addEventListener('click',function(e){e.stopPropagation();if(!cards.length||cards[currentIndex].cat==='info')return;var id=getId(cards[currentIndex]);reviewSet.add(id);knownSet.delete(id);nextCard();});
document.getElementById('shuffleBtn').addEventListener('click',shuffle);
document.getElementById('resetBtn').addEventListener('click',function(){if(confirm('Resetar todo o progresso?')){knownSet.clear();reviewSet.clear();applyFilter('all');}});
document.getElementById('restartBtn').addEventListener('click',restart);
document.querySelectorAll('.filter-btn').forEach(function(btn){btn.addEventListener('click',function(){applyFilter(btn.dataset.filter);});});
document.addEventListener('keydown',function(e){if(e.target===flashcard)return;if(e.key==='ArrowRight')nextCard();else if(e.key==='ArrowLeft')prevCard();else if(e.key===' '){e.preventDefault();toggleAnswer();}});
document.querySelector('[data-filter="all"]').textContent='Todos ('+allCards.length+')';
renderCard();
</script>
</body>
</html>
